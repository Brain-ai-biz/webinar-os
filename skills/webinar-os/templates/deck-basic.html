<!DOCTYPE html>
<!--
  ============================================================
  Webinar-OS · תבנית מצגת (עברית, RTL, 16:9, 1920x1080 מוקטן לחלון)
  ============================================================
  הקובץ הזה מתמלא אוטומטית: scripts/render_pages.py קורא deck.json והופך כל שקף
  לבלוק <section class="slide" data-pattern="..."> במקום שורת הפלייסהולדר של השקפים (slides_html) למטה.
  אפשר גם לערוך את deck.html שנוצר ביד: מעתיקים שקף, מדביקים, מחליפים טקסט.

  8 תבניות שקף: title · section · bullets · three-columns · big-stat · quote · screenshot · cta
  (המבנה של כל אחת: reference/deck-structure.md)

  הצגה: פותחים בדפדפן (כרום מומלץ). חץ ימינה / רווח = הבא, חץ שמאלה = הקודם, F = מסך מלא.
  שורות עם class="reveal" נחשפות אחת-אחת בלחיצה. קישור ישיר לשקף: #s=5 בסוף הכתובת.
  PDF: ?print בסוף הכתובת ואז Ctrl/Cmd+P → שמירה כ-PDF (שקף = עמוד).
  מערכת העיצוב: אותו בלוק :root (8 שורות) כמו דף ההרשמה, דף התודה והקריאייטיב.
  ============================================================
-->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{deck.title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== 1. מערכת העיצוב: 8 שורות, זהות בכל הקבצים ===== */
:root{
  --bg:{{brand.bg}};
  --surface:{{brand.surface}};
  --ink:{{brand.ink}};
  --muted:{{brand.muted}};
  --accent:{{brand.accent}};
  --accent-2:{{brand.accent_2}};
  --radius:{{brand.radius}};
  --font:'{{brand.font}}',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
/* ===== נגזרות (לא נוגעים) ===== */
:root{
  --on-accent:#17120A; --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.18);
  --accent-rgb:{{brand.accent_rgb}}; --glow:rgba(var(--accent-rgb),.22); --grid:rgba(255,255,255,.045);
  --grad:linear-gradient(120deg,var(--accent),var(--accent-2));
  --stage:#000; --ease:cubic-bezier(.2,.7,.2,1);
}

/* ===== 2. במה: שקף 1920x1080 שמוקטן לחלון ===== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--stage);color:var(--ink);font-family:var(--font);overflow:hidden}
#deck-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--stage)}
#deck{width:1920px;height:1080px;position:relative;overflow:hidden;transform-origin:center center;flex-shrink:0;background:var(--bg)}

.slide{display:none;position:absolute;inset:0;width:1920px;height:1080px;padding:120px 150px;background:var(--bg);color:var(--ink);overflow:hidden}
.slide.active{display:block}
/* הסצנה: גריד + זוהר, כמו בדפים */
.slide::before{content:'';position:absolute;inset:-10%;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse 65% 60% at 50% 30%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 65% 60% at 50% 30%,#000 0%,transparent 75%)}
.slide::after{content:'';position:absolute;width:1100px;height:1100px;right:-380px;top:-560px;border-radius:50%;background:var(--glow);filter:blur(140px);pointer-events:none}
.slide>*{position:relative;z-index:1}

/* טיפוגרפיה */
h1,h2,h3{font-weight:800;line-height:1.08;letter-spacing:-.02em}
h1{font-size:112px}
h2{font-size:80px}
h3{font-size:44px}
p{font-size:40px;line-height:1.45}
.muted{color:var(--muted)}
.warm{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{display:inline-flex;align-items:center;gap:18px;font-size:28px;font-weight:700;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:32px}
.kicker::before{content:'';width:48px;height:2px;background:currentColor;opacity:.7}
.eyebrow{display:inline-flex;gap:16px;align-items:center;font-weight:600;font-size:30px;color:var(--accent);border:2px solid rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.08);padding:14px 32px;border-radius:999px;margin-bottom:44px}
.eyebrow::before{content:'';width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 20px var(--accent)}
.divider{width:140px;height:4px;border-radius:2px;background:var(--grad);margin:40px 0}

/* ===== 3. תבניות ===== */
/* title */
[data-pattern="title"].active,body.print .slide[data-pattern="title"]{display:flex;flex-direction:column;justify-content:center}
[data-pattern="title"] h1{font-size:128px;max-width:1520px}
[data-pattern="title"] .sub{font-size:50px;color:var(--muted);margin-top:36px;max-width:1400px;line-height:1.3}
[data-pattern="title"] .event{position:absolute;bottom:100px;right:150px;display:flex;gap:16px;flex-wrap:wrap}
[data-pattern="title"] .event span{display:inline-flex;align-items:center;gap:12px;padding:16px 28px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:30px;font-weight:600}
[data-pattern="title"] .event b{color:var(--accent);font-weight:800}

/* section */
[data-pattern="section"].active,body.print .slide[data-pattern="section"]{display:flex;flex-direction:column;justify-content:center}
[data-pattern="section"] .n{font-size:200px;font-weight:900;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.04em;direction:ltr;text-align:right;opacity:.95}
[data-pattern="section"] h2{font-size:116px;margin-top:16px;max-width:1500px}
[data-pattern="section"] .sub{font-size:44px;color:var(--muted);margin-top:28px;max-width:1400px}

/* bullets */
[data-pattern="bullets"] ul{list-style:none;margin-top:56px}
[data-pattern="bullets"] li{font-size:52px;line-height:1.35;padding:0 84px 0 0;position:relative;margin-bottom:38px}
[data-pattern="bullets"] li::before{content:'';position:absolute;right:0;top:.5em;width:30px;height:30px;border-radius:50%;background:var(--grad);box-shadow:0 0 18px var(--glow)}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.reveal.on{opacity:1;transform:none}

/* three-columns */
[data-pattern="three-columns"] .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:64px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--radius) + 10px);padding:56px 48px;min-height:520px}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--accent) 0%,transparent 40%,transparent 70%,var(--accent-2) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.35;pointer-events:none}
.card .icon{width:104px;height:104px;border-radius:28px;background:var(--grad);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;margin-bottom:40px;box-shadow:0 12px 30px -10px var(--glow)}
.card h3{margin-bottom:20px}
.card p{font-size:32px;color:var(--muted);line-height:1.5}

/* big-stat */
[data-pattern="big-stat"].active,body.print .slide[data-pattern="big-stat"]{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
[data-pattern="big-stat"] .kicker::after{content:'';width:48px;height:2px;background:currentColor;opacity:.7}
[data-pattern="big-stat"] .big-num{font-size:320px;font-weight:900;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.04em;direction:ltr;font-variant-numeric:tabular-nums}
[data-pattern="big-stat"] .claim{font-size:64px;font-weight:700;margin-top:24px;max-width:1500px;line-height:1.2}
[data-pattern="big-stat"] .source{position:absolute;bottom:90px;right:150px;left:150px;font-size:28px;color:var(--muted)}
[data-pattern="big-stat"] .source a{color:var(--muted)}

/* quote */
[data-pattern="quote"].active,body.print .slide[data-pattern="quote"]{display:flex;flex-direction:column;justify-content:center}
[data-pattern="quote"] blockquote{font-size:88px;font-weight:700;line-height:1.22;max-width:1560px;padding-right:64px;border-right:12px solid var(--accent)}
[data-pattern="quote"] .who{font-size:40px;color:var(--muted);margin-top:48px;padding-right:76px}

/* screenshot */
[data-pattern="screenshot"] h2{font-size:64px;margin-bottom:44px}
.frame{position:relative;width:1620px;height:740px;border-radius:calc(var(--radius) + 6px);border:1px solid var(--line-2);background:var(--surface);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 90px -30px var(--glow)}
.frame::before{content:attr(data-placeholder);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--muted);text-align:center;padding:40px}
.frame img{position:relative;width:100%;height:100%;object-fit:cover;display:block;background:var(--bg)}
.frame img[hidden]{display:none}
.frame .chrome{position:absolute;top:0;right:0;left:0;height:44px;background:rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;padding:0 20px;z-index:2}
.frame .chrome i{width:14px;height:14px;border-radius:50%;background:var(--muted);display:block;opacity:.6}

/* cta */
[data-pattern="cta"].active,body.print .slide[data-pattern="cta"]{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
[data-pattern="cta"] .kicker::after{content:'';width:48px;height:2px;background:currentColor;opacity:.7}
[data-pattern="cta"] h2{font-size:104px;max-width:1500px}
.btn{display:inline-flex;align-items:center;gap:20px;margin-top:64px;padding:30px 84px;border-radius:999px;background:var(--grad);color:var(--on-accent);font-size:48px;font-weight:800;text-decoration:none;box-shadow:0 20px 60px -14px var(--glow)}
.btn::after{content:'←';font-weight:800}
[data-pattern="cta"] .small{font-size:32px;color:var(--muted);margin-top:40px}

/* ===== 4. ניווט ===== */
#nav{position:absolute;bottom:34px;left:44px;z-index:20;display:flex;gap:12px;direction:ltr;opacity:.3;transition:opacity .3s}
#nav.awake,#nav:focus-within,#nav:hover{opacity:1}
.nav-btn{width:72px;height:72px;border-radius:50%;border:1px solid var(--line-2);background:rgba(0,0,0,.35);color:var(--ink);font-size:36px;font-family:var(--font);cursor:pointer;line-height:1}
.nav-btn:hover{background:var(--accent);color:var(--on-accent)}
.nav-btn:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
#counter{position:absolute;bottom:52px;right:44px;z-index:20;font-size:24px;color:var(--muted);opacity:.5;font-variant-numeric:tabular-nums;direction:ltr}
#progress{position:absolute;bottom:0;right:0;height:6px;background:var(--grad);z-index:20;width:0;transition:width .3s var(--ease)}
:fullscreen #nav,:fullscreen #counter{opacity:0}
:fullscreen #nav:focus-within{opacity:1}

/* ===== 5. מצב הדפסה (?print) ===== */
body.print{overflow:auto;background:var(--stage)}
body.print #deck-wrap{position:static;display:block}
body.print #deck{transform:none!important;width:1920px;height:auto;overflow:visible;margin:0 auto}
body.print .slide{display:block;position:relative;margin:0 0 24px 0;page-break-after:always;break-after:page}
body.print .reveal{opacity:1;transform:none}
body.print #nav,body.print #counter,body.print #progress{display:none}
@page{size:1920px 1080px;margin:0}
@media print{
  body.print #deck{zoom:1!important}
  body.print .slide{margin:0}
  body.print .slide:last-child{page-break-after:auto;break-after:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .reveal{transform:none}
}
</style>
</head>
<body>
<div id="deck-wrap">
<div id="deck">

{{{slides_html}}}

<nav id="nav" aria-label="ניווט בין שקפים">
  <button class="nav-btn" id="btn-prev" type="button" aria-label="לשקף הקודם" title="הקודם (חץ שמאלה)">&lsaquo;</button>
  <button class="nav-btn" id="btn-next" type="button" aria-label="לשקף הבא" title="הבא (חץ ימינה / רווח)">&rsaquo;</button>
  <button class="nav-btn" id="btn-fs" type="button" aria-label="מסך מלא" title="מסך מלא (F)">&#9974;</button>
</nav>
<div id="counter" aria-live="polite">1 / 1</div>
<div id="progress" aria-hidden="true"></div>

</div>
</div>

<script>
(function(){
  var slides=[].slice.call(document.querySelectorAll('.slide')),n=slides.length,cur=0;
  var deck=document.getElementById('deck'),nav=document.getElementById('nav'),
      counter=document.getElementById('counter'),bar=document.getElementById('progress');
  var PRINT=/(^|[?&])print(=|&|$)/.test(location.search);
  if(PRINT){
    document.body.classList.add('print');
    function fitPrint(){deck.style.zoom=Math.min(1,innerWidth/1920);}
    addEventListener('resize',fitPrint);fitPrint();
    return;
  }
  function scaleToFit(){deck.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')';}
  addEventListener('resize',scaleToFit);scaleToFit();
  function show(i,fromHash){
    cur=Math.max(0,Math.min(n-1,i));
    slides.forEach(function(s,k){s.classList.toggle('active',k===cur);});
    counter.textContent=(cur+1)+' / '+n;
    bar.style.width=((cur+1)/n*100)+'%';
    if(!fromHash){history.replaceState(null,'','#s='+(cur+1));}
    slides[cur].querySelectorAll('.reveal').forEach(function(r){r.classList.remove('on');});
  }
  function next(){
    var r=slides[cur].querySelector('.reveal:not(.on)');
    if(r){r.classList.add('on');return;}
    if(cur<n-1)show(cur+1);
  }
  function prev(){
    var on=slides[cur].querySelectorAll('.reveal.on');
    if(on.length){on[on.length-1].classList.remove('on');return;}
    if(cur>0){show(cur-1);slides[cur].querySelectorAll('.reveal').forEach(function(r){r.classList.add('on');});}
  }
  function fromHash(){var m=/s=(\d+)/.exec(location.hash);show(m?+m[1]-1:0,true);}
  addEventListener('hashchange',fromHash);fromHash();
  addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    switch(e.key){
      case 'ArrowRight':case ' ':case 'PageDown':case 'Enter':e.preventDefault();next();break;
      case 'ArrowLeft':case 'PageUp':case 'Backspace':e.preventDefault();prev();break;
      case 'Home':show(0);break;
      case 'End':show(n-1);break;
      case 'f':case 'F':toggleFS();break;
    }
  });
  function toggleFS(){
    if(document.fullscreenElement){document.exitFullscreen();}
    else{(document.documentElement.requestFullscreen||function(){}).call(document.documentElement);}
  }
  document.getElementById('btn-next').addEventListener('click',next);
  document.getElementById('btn-prev').addEventListener('click',prev);
  document.getElementById('btn-fs').addEventListener('click',toggleFS);
  deck.addEventListener('click',function(e){
    if(e.target.closest('#nav')||e.target.closest('a'))return;
    next();
  });
  var t;
  addEventListener('mousemove',function(){
    nav.classList.add('awake');clearTimeout(t);
    t=setTimeout(function(){nav.classList.remove('awake');},2000);
  });
})();
</script>
</body>
</html>
